# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: "Go"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiling is what every platform has a real claim on: cgo-free build tags,
  # the unix/windows-only files beside conn.go, that sort of thing.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        # go.mod declares `go 1.26.0`, which golang.org/x/net requires. A
        # hand-kept matrix below that version does not test anything: GOTOOLCHAIN
        # quietly downloads 1.26 to build the module, so every entry in it was
        # really the same build. Reading the version from go.mod keeps this in
        # step with what consumers actually resolve.
        go-version-file: go.mod
    - run: go version
    - name: Build
      run: go build -v ./...
    - name: Vet
      run: go vet ./...

  # The suite replays recorded byte streams and forks `openssl s_client`, so its
  # pass/fail set belongs to one environment rather than to three. Running it in
  # three places multiplies the baselines without adding signal; the other two
  # platforms are covered above by build + vet.
  test:
    runs-on: ubuntu-latest
    env:
      # Byte-for-byte name comparison, so a locale must not reorder `Test_1` against
      # `TestX` between the sort of the list and the sort of the results.
      LC_ALL: C
      # Nil-panics in Conn.write while sending an alert (conn.go:949, reached from
      # handshake_server_tls13.go:213 via handshake_server_test.go:1948). The panic
      # kills the test binary, which silently drops every test declared after it -
      # so recording it as a failure would have frozen a result set that is really
      # a truncation. Skipping it costs one replayed flow and buys a complete,
      # reproducible run; it is the only test this gate skips.
      SKIP_TEST: ^TestAESCipherReorderingTLS13$
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: gofmt
      shell: bash
      run: |
        # testenv/ is a copy out of the Go tree and keeps upstream formatting.
        out=$(gofmt -l . | grep -v '^testenv/' || true)
        if [ -n "$out" ]; then
          echo "::error::these files are not gofmt'd:"
          echo "$out"
          exit 1
        fi
    - name: Test
      shell: bash
      run: |
        # -v, not because the per-test noise is wanted, but because it is the only
        # way to see which tests *started*: a silent short result set is how an
        # aborted binary hides, and this suite has a known crasher (see SKIP_TEST).
        go test -count=1 -timeout 30m -v -skip "$SKIP_TEST" ./... > test.log 2>&1
        status=$?

        # Every failing test's name and reason goes to the log artifact below; the
        # console gets the index, not the 400 KB of hex the byte comparisons print.
        grep -E '^(--- (PASS|FAIL|SKIP): |panic:|fatal error:|FAIL|ok  )' test.log > console.log || true
        cat console.log

        if [ "$status" -ne 0 ] && ! grep -q '^--- FAIL: ' test.log; then
          echo "::error::go test exited $status without reporting any test failure - a build error or an early abort, not a fingerprint change"
          tail -40 test.log
          exit 1
        fi
        if grep -qE '^(panic:|fatal error:)' test.log; then
          echo "::error::an unhandled panic or fatal error ended a test binary; only a skip of the crashing test keeps the result set complete"
          grep -nE '^(panic:|fatal error:)' test.log | head
          exit 1
        fi

        # Did the whole suite actually run? `go test -list` does not apply -skip, so
        # the tests the skip removed are listed separately and subtracted.
        go test -list '.*' ./... 2>/dev/null | grep '^Test' | sort -u > listed.txt
        go test -list "$SKIP_TEST" ./... 2>/dev/null | grep '^Test' | sort -u > skipped.txt
        comm -23 listed.txt skipped.txt > expected.txt
        grep -hE '^--- (PASS|FAIL|SKIP): ' test.log | sed -E 's/^--- [A-Z]+: ([^ ]+).*/\1/' | sort -u > ran.txt
        comm -23 expected.txt ran.txt > never_ran.txt
        if [ -s never_ran.txt ]; then
          echo "::error::$(wc -l < never_ran.txt | tr -d ' ') listed tests produced no result - a binary stopped early, so this result set is a truncation and cannot be gated"
          cat never_ran.txt
          exit 1
        fi

        grep -E '^--- FAIL: ' test.log | sed -E 's/^--- FAIL: ([^ ]+).*/\1/' | sort -u > failures.txt
        grep -v '^#' .github/known-test-failures.txt | sed '/^$/d' | sort -u > baseline.txt

        comm -13 baseline.txt failures.txt > new.txt
        comm -23 baseline.txt failures.txt > fixed.txt

        echo "expected failures: $(wc -l < baseline.txt | tr -d ' ')   actual: $(wc -l < failures.txt | tr -d ' ')   tests run: $(wc -l < ran.txt | tr -d ' ')"

        if [ -s new.txt ]; then
          {
            echo "::error::new test failures - .github/known-test-failures.txt lists what this suite is already expected to fail, and says why"
            cat new.txt
          } >&2
          exit 1
        fi
        if [ -s fixed.txt ]; then
          echo "::warning::$(wc -l < fixed.txt | tr -d ' ') recorded tests now pass; prune .github/known-test-failures.txt:"
          tr '\n' ' ' < fixed.txt >&2
          echo >&2
        fi
        echo "Test failures match the recorded baseline."
    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: go-test-log
        path: test.log
        retention-days: 14
        if-no-files-found: warn
